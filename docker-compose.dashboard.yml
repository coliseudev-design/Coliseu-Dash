version: '3.8'

services:
  dashboard-middleware:
    build: 
      context: ./middleware
      dockerfile: Dockerfile
    container_name: dashboard-middleware
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3200
      
      # Banco de dados
      - PG_HOST=${PG_HOST}
      - PG_PORT=5432
      - PG_DATABASE=coliseu_dashboard
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_SSL=false
      
      # Identity Server / Segurança
      - JWT_DEVICE_KEY=${JWT_DEVICE_KEY}
      - EXPECTED_MODULE_SLUG=dashboard
      
      # Comunicação com o Worker
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      
      # Limits
      - RATE_LIMIT_MAX=1000
    
    ports:
      - "3200:3200"
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:3200/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Conectar à rede preexistente do ecossistema coliseu
    networks:
      - default

networks:
  default:
    name: coliseu_network
    external: true
