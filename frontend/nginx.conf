server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;
    client_body_buffer_size 50M;

    # DNS dinâmico do Docker (evita 502 Bad Gateway quando o middleware reinicia/muda de IP e desativa IPv6 fantasma)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Identidade explícita do projeto Coliseu Dash
    add_header X-Coliseu-App "coliseu-dash" always;

    # Otimização gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Assets estáticos com hash imutável do Vite (evita erros de chunk desatualizado)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Coliseu-App "coliseu-dash" always;
    }

    # HTML principal nunca deve ficar preso em cache após deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Coliseu-App "coliseu-dash" always;
    }

    # Fallback SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Backend exclusivo do Coliseu Dash (resolução DNS dinâmica via variável)
    location /api/ {
        set $dash_backend "http://dashboard-middleware:3200";
        proxy_pass $dash_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-App "coliseu-dash";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy para os Webhooks do Worker (Acesso .NET)
    location /internal/ {
        set $dash_backend "http://dashboard-middleware:3200";
        proxy_pass $dash_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-App "coliseu-dash";
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Bloqueia arquivos ocultos (.git, .env)
    location ~ /\. {
        deny all;
    }
}
