version: '3.8'

services:
  # Serviço 1: Frontend SPA (React/Vite + Nginx)
  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"  # Exposto na porta 3000 ou diretamente via DNS Manager do Coolify
    depends_on:
      - dashboard-middleware
    networks:
      - default

  # Serviço 2: API Node.js Express (Backend)
  dashboard-middleware:
    build: 
      context: ./middleware
      dockerfile: Dockerfile
    container_name: dashboard-middleware
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3200
      
      # Banco de dados (passar via secret/env variables no GitHub Actions / Coolify)
      - PG_HOST=${PG_HOST}
      - PG_PORT=5432
      - PG_DATABASE=coliseu_dashboard
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_SSL=false
      
      # Identity Server / Segurança
      - JWT_DEVICE_KEY=${JWT_DEVICE_KEY}
      - EXPECTED_MODULE_SLUG=dashboard
      
      # Comunicação com o Worker
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      
      # Limits
      - RATE_LIMIT_MAX=1000
    
    ports:
      - "3200:3200" # Idealmente em producao só a comunicação interna existe, mas expor permite chamadas do worker caso precise fora da rede.
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:3200/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default

networks:
  default:
    name: coliseu_network
