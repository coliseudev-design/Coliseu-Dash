version: '3.8'

services:
  # Serviço 1: Frontend SPA (React/Vite + Nginx) — Exclusivo Coliseu Dash
  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    hostname: coliseu-dash-frontend
    restart: unless-stopped
    ports:
      - "80"  # Permitir que Coolify mapie dinamicamente via Traefik
    networks:
      - coolify
    depends_on:
      - dashboard-middleware
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Serviço 2: API Node.js Express (Backend) — Exclusivo Coliseu Dash
  dashboard-middleware:
    build: 
      context: ./middleware
      dockerfile: Dockerfile
    container_name: dashboard-middleware
    hostname: coliseu-dash-middleware
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - NODE_ENV=production
      - PORT=3200
      - APP_ID=coliseu-dash
      
      # Banco de dados exclusivo Coliseu Dash (coliseu_dashboard)
      - PG_HOST=${PG_HOST}
      - PG_PORT=5432
      - PG_DATABASE=${PG_DATABASE:-coliseu_dashboard}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_SSL=false
      
      # Identity Server / Segurança
      - JWT_DEVICE_KEY=${JWT_DEVICE_KEY}
      - EXPECTED_MODULE_SLUG=coliseu-dash
      - IDENTITY_API_URL=https://adminlicencas.coliseusistemas.com.br
      - IDENTITY_INTERNAL_KEY=${INTERNAL_API_KEY}
      
      # Comunicação com o Worker
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      
      # Limits
      - RATE_LIMIT_MAX=1000
    
    ports:
      - "3200" # Exposto apenas para a rede interna; Nginx/Traefik cuidam do roteamento externo
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:3200/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# db-backup removido pois o Coolify cuida do backup da base central nativamente.

networks:
  coolify:
    external: true
